name: Validate external simulator bridge

on:
  push:
    paths:
      - 'src/external_sim_bridge/**'
      - 'src/DistributedSatelliteSim/**'
      - '.github/workflows/validate-external-sim-bridge.yml'
  pull_request:
    paths:
      - 'src/external_sim_bridge/**'
      - 'src/DistributedSatelliteSim/**'
      - '.github/workflows/validate-external-sim-bridge.yml'
  workflow_dispatch:

jobs:
  validate-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Downcase repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ROS 2 validation image
        run: docker pull ghcr.io/${{ env.REPO }}:latest

      - name: Build and test external simulator bridge with Basilisk
        env:
          ASTRO_EXPECT_BASILISK: '1'
        run: |
          docker run --rm \
            --user root \
            -e ASTRO_EXPECT_BASILISK="${ASTRO_EXPECT_BASILISK}" \
            -v "${GITHUB_WORKSPACE}:/home/ws" \
            -w /home/ws \
            ghcr.io/${{ env.REPO }}:latest \
            bash -lc '
              set -e
              source /opt/ros/kilted/setup.bash
              python3 -m pip install --break-system-packages "bsk==2.10.0"
              python3 -c "import Basilisk; print(Basilisk.__version__)"
              rosdep update
              rosdep install --from-paths src --ignore-src -y
              colcon build --packages-select distributed_satellite_sim external_sim_bridge
              source install/setup.bash
              colcon test --packages-select external_sim_bridge
              colcon test-result --verbose
            '
