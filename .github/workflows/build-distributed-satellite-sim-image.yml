name: Build and publish distributed_satellite_sim deployment image

on:
  push:
    branches: [main]
    paths:
      - '.docker/distributed_satellite_sim.Dockerfile'
      - '.docker/distributed_satellite_sim.entrypoint.sh'
      - 'src/DistributedSatelliteSim'
      - '.github/workflows/build-distributed-satellite-sim-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deployment image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/distributed_satellite_sim.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/distributed-satellite-sim:latest
            ghcr.io/${{ env.REPO }}/distributed-satellite-sim:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
